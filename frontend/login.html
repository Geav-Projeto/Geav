<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Entrar — GEAV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="login-pagina">
    <main class="login-caixa">
        <h1>Entrar</h1>
        <p class="login-sub">Acesso restrito a pessoas autorizadas do GEAV.</p>
        <form id="formLogin" novalidate>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="username" maxlength="255" required>
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="current-password" maxlength="200" required>
            <p class="login-erro" id="erro" role="alert"></p>
            <button type="submit" class="btn-gold" id="botao">Entrar</button>
        </form>
        <a href="index.html" class="login-voltar">← Voltar ao site</a>
    </main>
    <script src="config.js"></script>
    <script src="login.js"></script>
</body>
</html>
